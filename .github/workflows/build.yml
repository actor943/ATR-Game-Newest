name: Build Flet App (Custom)

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: windows
            runner: windows-latest
            artifact_name: windows-package
          - target: macos
            runner: macos-latest
            artifact_name: macos-package
          - target: apk
            runner: macos-latest
            artifact_name: android-apk

    runs-on: ${{ matrix.runner }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ⚠ flet 版本必须与 app 代码一致（当前是 1.0.4）。
      #   代码用的是 1.0 的 API：page.window / page.show_dialog /
      #   Dropdown.on_select / ft.Button / ft.Icons。
      #   若这里装 0.85.3，bundle 里的运行时与 Flutter 客户端版本不匹配，
      #   运行起来就是「白屏、无响应、窗口模式也不生效」。
      #   注意：决定「打包进 .app 的运行时版本」的是 pyproject.toml 的
      #   project.dependencies，不是这里；这里只决定构建用的 Flutter 客户端。
      #   所以版本号要与 pyproject.toml / requirements.txt 三处对齐，
      #   千万别只改 workflow 这一处。
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import flet, flet_cli; print('flet build runtime:', flet.__version__)"

      - name: Build ${{ matrix.target }}
        run: flet build ${{ matrix.target }} --yes --no-rich-output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/${{ matrix.target }}
          if-no-files-found: error
