[project]
name = "atr-game"
version = "0.4.9"
description = "ATR Game — 牌类游戏合集（掼蛋 / Splendor / Chess / Chinese Chess）"
readme = "README.txt"
requires-python = ">=3.10"
dependencies = [
    # ⚠ 这个 pin 决定「打包进 .app 的 Python 运行时版本」（flet build 会把
    #   project.dependencies 转成 requirements 装进 bundle），必须与 app 代码
    #   用的 API 版本一致：代码用的是 1.0 的 API（page.window / show_dialog /
    #   Dropdown.on_select / ft.Button / ft.Icons）。改版本时这里要一起改。
    "flet==1.0.4",
    # ⚠ 房间语音的 numpy / sounddevice **不要**放这里：这是「所有平台」的公共
    #   依赖，放进来 Android / iOS / Web 包也会去装 sounddevice —— 它没有
    #   对应平台的 wheel，构建直接失败；手机端也用不到 PortAudio。
    #   桌面端语音依赖写在下面 [tool.flet.<平台>.dependencies]（0.4.8-fix）。
]

# ---------------------------------------------------------------
# 房间语音（core/net/voice.py）：sounddevice 内部是 PortAudio 原生库，
# 只有桌面平台（Windows / macOS / Linux）打得进、也用得上。
#
# ⚠ flet build 只把 **project.dependencies + tool.flet.<平台>.dependencies**
#   装进安装包；requirements.txt 只影响开发 venv 与 CI 环境，不进 bundle。
#   0.4.8 实测 bug：语音库只加在 requirements.txt 里 → 源码运行能开麦，
#   分发版却提示「没有语音库」。要改就改这里（requirements.txt 保持对齐即可）。
# ---------------------------------------------------------------

[tool.flet.macos]
dependencies = ["numpy>=1.26", "sounddevice>=0.4.6"]

[tool.flet.windows]
dependencies = ["numpy>=1.26", "sounddevice>=0.4.6"]

[tool.flet.linux]
dependencies = ["numpy>=1.26", "sounddevice>=0.4.6"]

# macOS 麦克风权限：没有这条键，系统会**直接拒绝**录音（连授权弹窗都不弹），
# 分发版里语音等于废掉 —— 库装齐了也不够，权限说明必须一起给。
[tool.flet.macos.info]
NSMicrophoneUsageDescription = "与同房玩家语音聊天需要访问麦克风；仅在你手动打开麦克风时采集，音频只发往同一局域网内的对局设备。"

# iOS 同理（当前 iOS 包不带语音库，权限键先留着，将来上 iOS 语音不用再找）。
[tool.flet.ios.info]
NSMicrophoneUsageDescription = "与同房玩家语音聊天需要访问麦克风；仅在你手动打开麦克风时采集，音频只发往同一局域网内的对局设备。"

# ---------------------------------------------------------------
# Flet 打包配置（flet build apk / macos / ipa 都会读这里的 [tool.flet]）
# 文档：https://flet.dev/docs/publish
# ---------------------------------------------------------------
[tool.flet]
# 应用显示名（窗口标题 / 桌面图标名 / 各平台应用名）
product = "ATR Game"
# 反色域名，决定各平台的包标识（bundle id / application id）
org = "com.atrgame"
# 制品名前缀（apk 输出 ATR Game-release.apk 之类）
artifact = "ATR Game"
company = "ATR Game"
copyright = "Copyright © 2026 ATR Game"

# 入口模块（flet build 默认找 main.py）
[tool.flet.app]
# 显式指定入口文件是 main.py（或者去掉 .py 后缀的模块名）
module = "main"
# 不打进安装包的东西：两个 venv、缓存、构建产物
# 注意：曾经这里写死排除 ``assets/Songs``（想在桌面端省体积），但那个名字首字母
# 大写，在大小写不敏感的 macOS 上正好匹配到真实的 ``assets/songs``，于是
# `flet build apk` 在 Mac 上打包时把整个音频目录都排除了 —— 手机端「没有音频库」。
# 0.4.10：把音频资源（歌曲 / 音效）一并打进所有平台的安装包，桌面端语音仍由
# [tool.flet.<平台>].dependencies 的 sounddevice 提供（见下方语音小节）。
exclude = [
    "venv",
    ".venv",
    "__pycache__",
    "*.pyc",
    "build",
    "dist",
]

# Android：自适应图标底色用主题蓝；不给敏感权限
[tool.flet.android]
adaptive_icon_background = "#1976D2"

# 启动画面配色（跟主题一致，避免闪白）
[tool.flet.splash]
color = "#1976D2"
dark_color = "#121212"
icon_bgcolor = "#1976D2"
icon_dark_bgcolor = "#121212"
